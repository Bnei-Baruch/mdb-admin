name: CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
          - internal
          - dev

# GITHUB_TOKEN only ever needs to read the repo
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image: bneibaruch/mdb_admin:${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.BBDEPLOYMENT_DOCKERHUB_USERNAME }}
          password: ${{ secrets.BBDEPLOYMENT_DOCKERHUB_PASSWORD }}

      - name: Set environment-specific variables
        run: |
          # archive servers (staging/production) pull external-* tags (see /root/archive-docker/docker-compose.yml)
          case "${{ inputs.environment }}" in
            staging|production) echo "TAG_PREFIX=external-" >> $GITHUB_ENV ;;
            *) echo "TAG_PREFIX=" >> $GITHUB_ENV ;;
          esac
          case "${{ inputs.environment }}" in
            production)
              echo "PUBLIC_BASE=https://kabbalahmedia.info/" >> $GITHUB_ENV
              echo "CDN_URL=https://cdn.kabbalahmedia.info/" >> $GITHUB_ENV
              ;;
            staging)
              echo "PUBLIC_BASE=https://staging-archive.kabbalahmedia.info/" >> $GITHUB_ENV
              echo "CDN_URL=https://staging-cdn.kabbalahmedia.info/" >> $GITHUB_ENV
              ;;
            internal)
              echo "PUBLIC_BASE=http://app.mdb.bbdomain.org/" >> $GITHUB_ENV
              echo "CDN_URL=http://app.mdb.bbdomain.org/links/" >> $GITHUB_ENV
              ;;
            dev)
              echo "PUBLIC_BASE=http://dev.mdb.bbdomain.org/" >> $GITHUB_ENV
              echo "CDN_URL=http://dev.mdb.bbdomain.org/links/" >> $GITHUB_ENV
              ;;
          esac
      - name: Set image tag
        id: tag
        run: echo "tag=${TAG_PREFIX}${{ inputs.environment }}_${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            bneibaruch/mdb_admin:${{env.TAG_PREFIX}}${{inputs.environment}}
            bneibaruch/mdb_admin:${{env.TAG_PREFIX}}${{inputs.environment}}_${{github.run_number}}
          build-args: |
            app_env=${{inputs.environment}}
            public_base=${{env.PUBLIC_BASE}}
            cdn_url=${{env.CDN_URL}}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'production')
    steps:
      - name: Set deployment variables
        run: |
          if [[ "${{ github.event.inputs.environment }}" == "staging" ]]; then
            echo "SSH_HOST=${{ secrets.ARCHIVE_HOST_STAGING }}" >> $GITHUB_ENV
          else
            echo "SSH_HOST=${{ secrets.ARCHIVE_HOST_PRODUCTION }}" >> $GITHUB_ENV
          fi

      - name: Deploy to ${{ github.event.inputs.environment }} via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ env.SSH_HOST }}
          username: root
          key: ${{ secrets.BBDEPLOYMENT_SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.SSH_PROXY_HOST }}
          proxy_username: ${{ secrets.SSH_PROXY_USERNAME }}
          proxy_key: ${{ secrets.BBDEPLOYMENT_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /root/archive-docker
            sed -i 's/^MDB_ADMIN_VERSION=.*/MDB_ADMIN_VERSION=${{github.event.inputs.environment}}_${{github.run_number}}/' .env
            docker compose pull admin_ui
            docker compose up -d --no-deps admin_ui

  deploy-dev:
    runs-on: [self-hosted, linux, merkaz]
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev'
    steps:
      - name: Deploy to dev via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.MDB_HOST_STAGING }}
          username: root
          key: ${{ secrets.BBDEPLOYMENT_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /root/mdb-docker
            sed -i 's/^ADMIN_UI_VERSION=.*/ADMIN_UI_VERSION=dev_${{github.run_number}}/' .env
            docker compose pull admin_ui
            docker compose up -d --no-deps admin_ui

  # internal production is a legacy (non docker) VM: extract the build out of the
  # image and serve it from /sites/admin (nginx root /sites)
  extract-internal:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'internal'
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.BBDEPLOYMENT_DOCKERHUB_USERNAME }}
          password: ${{ secrets.BBDEPLOYMENT_DOCKERHUB_PASSWORD }}

      - name: Extract build from image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE}"
          dummy="dummy_mdb_admin_${{ github.run_number }}"
          docker create --name "${dummy}" "${IMAGE}"
          docker cp "${dummy}:/app" ./build
          docker rm -f "${dummy}"
          [ -f build/index.html ] || exit 1
          mkdir -p dist
          tar -czf "dist/admin-${{ github.run_number }}.tar.gz" -C build .

      - name: Upload deployment payload
        uses: actions/upload-artifact@v4
        with:
          name: admin-${{ github.run_number }}
          path: dist
          retention-days: 7

  deploy-internal:
    runs-on: [self-hosted, linux, merkaz]
    needs: extract-internal

    env:
      VER: ${{ github.run_number }}
      SSH_HOST: ${{ secrets.MDB_HOST_OLD || 'app.mdb.bbdomain.org' }}

    steps:
      - name: Download deployment payload
        uses: actions/download-artifact@v4
        with:
          name: admin-${{ github.run_number }}
          path: dist

      - name: Upload build to ${{ env.SSH_HOST }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SSH_HOST }}
          username: root
          key: ${{ secrets.BBDEPLOYMENT_SSH_PRIVATE_KEY }}
          source: "dist/*"
          strip_components: 1
          target: /tmp/admin-${{ env.VER }}

      - name: Install
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ env.SSH_HOST }}
          username: root
          key: ${{ secrets.BBDEPLOYMENT_SSH_PRIVATE_KEY }}
          envs: VER
          script: |
            set -e
            rm -rf /sites/admin_new
            mkdir /sites/admin_new
            tar -xzf /tmp/admin-${VER}/admin-${VER}.tar.gz -C /sites/admin_new
            chown -R archive:archive /sites/admin_new

            # keep the previous build around for a quick rollback
            rm -rf /sites/admin_prev
            mv /sites/admin /sites/admin_prev
            mv /sites/admin_new /sites/admin

            rm -rf /tmp/admin-${VER}
